<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="Segoe UI, Arial">
  <rect width="900" height="300" fill="#f8fafc"/>
  <text x="450" y="28" text-anchor="middle" font-size="17" font-weight="800" fill="#082B59">Arquitetura do Sistema — IMP / NHOMINCA</text>

  <!-- Browser -->
  <rect x="20" y="90" width="180" height="120" rx="12" fill="#082B59"/>
  <text x="110" y="140" text-anchor="middle" fill="#fff" font-weight="800" font-size="15">Navegador</text>
  <text x="110" y="165" text-anchor="middle" fill="#bfdbfe" font-size="11">React 19 + Vite</text>
  <text x="110" y="183" text-anchor="middle" fill="#bfdbfe" font-size="11">Tailwind • PWA</text>

  <path d="M200 150 h60" stroke="#0f3d7a" stroke-width="3" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f3d7a"/></marker>
  </defs>
  <text x="230" y="140" text-anchor="middle" font-size="10" fill="#334155">HTTPS</text>

  <!-- Vercel / Express -->
  <rect x="260" y="60" width="220" height="180" rx="12" fill="#ffffff" stroke="#082B59" stroke-width="2.5"/>
  <text x="370" y="95" text-anchor="middle" font-weight="800" font-size="15" fill="#082B59">Vercel (Servidor Node)</text>
  <rect x="285" y="110" width="170" height="40" rx="8" fill="#eff6ff" stroke="#1d4ed8"/>
  <text x="370" y="135" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">Express API (server.ts)</text>
  <rect x="285" y="160" width="170" height="40" rx="8" fill="#fef3c7" stroke="#b45309"/>
  <text x="370" y="185" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">Sessões / Auth API</text>

  <path d="M480 150 h60" stroke="#0f3d7a" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="510" y="140" text-anchor="middle" font-size="10" fill="#334155">DATABASE_URL</text>

  <!-- Neon -->
  <rect x="540" y="60" width="180" height="180" rx="12" fill="#0f172a"/>
  <text x="630" y="100" text-anchor="middle" font-weight="800" font-size="15" fill="#fff">Neon PostgreSQL</text>
  <text x="630" y="130" text-anchor="middle" font-size="11" fill="#a5f3fc">Drizzle ORM</text>
  <text x="630" y="152" text-anchor="middle" font-size="11" fill="#a5f3fc">users • faturas • recibos</text>
  <text x="630" y="170" text-anchor="middle" font-size="11" fill="#a5f3fc">caixa_movs • auditoria_logs</text>
  <text x="630" y="188" text-anchor="middle" font-size="11" fill="#a5f3fc">embarcacoes • atracacoes…</text>

  <!-- GitHub -->
  <rect x="745" y="100" width="130" height="100" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="810" y="140" text-anchor="middle" font-weight="800" font-size="13" fill="#111827">GitHub</text>
  <text x="810" y="163" text-anchor="middle" font-size="10" fill="#334155">mendesdelfim…/</text>
  <text x="810" y="178" text-anchor="middle" font-size="10" fill="#334155">Nhominca_IMP_BD</text>
